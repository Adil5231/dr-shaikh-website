    .ts-section {
      --ts-primary: var(--primary, #0f766e);
      --ts-secondary: var(--secondary, #14b8a6);
      --ts-accent: var(--accent, #06b6d4);
      --ts-text: var(--text, #1f2937);
      --ts-deep: color-mix(in srgb, var(--ts-primary) 45%, #04211f);
      --ts-muted: color-mix(in srgb, var(--ts-text) 68%, #fff);
      --ts-tint: color-mix(in srgb, var(--ts-secondary) 14%, #fff);
      --ts-line: color-mix(in srgb, var(--ts-text) 11%, #fff);
      --ts-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --ts-body: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      --ts-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      --ts-gap: 1.25rem;
      --ts-per: 1;

      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: clamp(3.5rem, 2.5rem + 5vw, 6.5rem) 0;
      font-family: var(--ts-body);
      color: var(--ts-text);
      background: color-mix(in srgb, var(--ts-secondary) 6%, #fff);
    }
    .ts-section *, .ts-section *::before, .ts-section *::after { box-sizing: border-box; }

    /* Ambient colour behind the glass cards */
    .ts-section::before, .ts-section::after {
      content: "";
      position: absolute;
      z-index: -1;
      width: min(520px, 70vw);
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    .ts-section::before { top: -10%; right: -8%; background: var(--ts-accent); opacity: 0.22; }
    .ts-section::after { bottom: -12%; left: -8%; background: var(--ts-secondary); opacity: 0.26; }

    .ts-wrap { width: 100%; max-width: 1180px; margin-inline: auto; padding-inline: 1.25rem; }

    /* ---------- Heading + controls ---------- */
    .ts-head {
      display: grid;
      gap: 1.5rem;
      align-items: end;
      margin-bottom: clamp(1.75rem, 3vw, 2.75rem);
    }
    .ts-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
      padding: 0.35rem 0.95rem;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--ts-primary);
      background: rgb(255 255 255 / 0.7);
      border: 1px solid color-mix(in srgb, var(--ts-secondary) 35%, #fff);
      border-radius: 999px;
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
    }
    .ts-tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ts-secondary); box-shadow: 0 0 0 4px rgb(20 184 166 / 0.2); }
    .ts-title {
      margin: 0 0 0.8rem;
      font-family: var(--ts-display);
      font-size: clamp(1.9rem, 1.3rem + 2.6vw, 3rem);
      font-weight: 600;
      line-height: 1.12;
      letter-spacing: -0.02em;
      color: var(--ts-deep);
      text-wrap: balance;
    }
    .ts-intro { margin: 0; max-width: 34rem; font-size: clamp(1.02rem, 1rem + 0.25vw, 1.15rem); line-height: 1.7; color: var(--ts-muted); }

    .ts-nav { display: none; gap: 0.7rem; }
    .ts-arrow {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      padding: 0;
      color: var(--ts-primary);
      background: rgb(255 255 255 / 0.85);
      border: 1.5px solid color-mix(in srgb, var(--ts-primary) 30%, #fff);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 8px 18px -10px rgb(15 118 110 / 0.4);
      transition: transform 0.3s var(--ts-ease), background-color 0.3s var(--ts-ease), color 0.3s var(--ts-ease), opacity 0.3s var(--ts-ease);
    }
    .ts-arrow svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .ts-arrow:hover:not(:disabled) { transform: translateY(-2px); color: #fff; background: var(--ts-primary); border-color: var(--ts-primary); }
    .ts-arrow:disabled { opacity: 0.4; cursor: not-allowed; }

    @media (min-width: 720px) {
      .ts-head { grid-template-columns: 1fr auto; }
      .ts-nav { display: flex; }
    }

    /* ---------- Carousel ---------- */
    .ts-viewport { position: relative; margin-inline: -1.25rem; }
    /* soft edge fade hints at more content */
    .ts-viewport::before, .ts-viewport::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      z-index: 2;
      width: 1.25rem;
      pointer-events: none;
    }
    .ts-viewport::before { left: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--ts-secondary) 6%, #fff), transparent); }
    .ts-viewport::after { right: 0; background: linear-gradient(-90deg, color-mix(in srgb, var(--ts-secondary) 6%, #fff), transparent); }

    .ts-track {
      display: flex;
      gap: var(--ts-gap);
      margin: 0;
      padding: 0.5rem 1.25rem 1.5rem;
      list-style: none;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-padding-inline: 1.25rem;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .ts-track::-webkit-scrollbar { display: none; }
    .ts-track:focus-visible { outline: 3px solid var(--ts-accent); outline-offset: -3px; border-radius: 24px; }

    .ts-slide {
      flex: 0 0 calc((100% - 2.5rem - (var(--ts-per) - 1) * var(--ts-gap)) / var(--ts-per));
      min-width: 0;
      scroll-snap-align: start;
    }
    @media (min-width: 720px) { .ts-section { --ts-per: 2; } }
    @media (min-width: 1040px) { .ts-section { --ts-per: 3; --ts-gap: 1.5rem; } }
    @media (min-width: 1240px) {

      .ts-viewport { margin-inline: 0; }
      .ts-viewport::before, .ts-viewport::after { display: none; }
      .ts-track { padding-inline: 0; scroll-padding-inline: 0; }
      .ts-slide { flex-basis: calc((100% - (var(--ts-per) - 1) * var(--ts-gap)) / var(--ts-per)); }
    }

    /* ---------- Review card ---------- */

  <script>
    /* Scroll-snap carousel: works with touch, trackpad and keyboard even without JS.
       JS adds the arrow buttons and the pagination dots. */
    (function () {
      var section = document.currentScript.parentElement;
      var track = section.querySelector('#tsTrack');
      var prev = section.querySelector('#tsPrev');
      var next = section.querySelector('#tsNext');
      var dotsEl = section.querySelector('#tsDots');
      var slides = track.querySelectorAll('.ts-slide');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      var pages = 1;

      function behavior() { return reduce.matches ? 'auto' : 'smooth'; }
      function maxScroll() { return track.scrollWidth - track.clientWidth; }
      function step() {
        var a = slides[0].getBoundingClientRect();
        var b = slides[1].getBoundingClientRect();
        return Math.max(b.left - a.left, a.width);
      }
      function perView() { return Math.max(1, Math.round(track.clientWidth / step())); }

      function buildDots() {
        pages = Math.max(1, Math.ceil(slides.length / perView()));
        dotsEl.innerHTML = '';
        dotsEl.hidden = pages < 2;
        for (var i = 0; i < pages; i++) {
          var li = document.createElement('li');
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'ts-dot';
          b.setAttribute('aria-label', 'Go to group ' + (i + 1) + ' of ' + pages);
          (function (idx) {
            b.addEventListener('click', function () {
              var target = pages > 1 ? (idx / (pages - 1)) * maxScroll() : 0;
              track.scrollTo({ left: target, behavior: behavior() });
            });
          })(i);
          li.appendChild(b);
          dotsEl.appendChild(li);
        }
        update();
      }

      function update() {
        var max = maxScroll();
        var pos = track.scrollLeft;
        prev.disabled = pos <= 2;
        next.disabled = pos >= max - 2;
        var page = max > 0 ? Math.round((pos / max) * (pages - 1)) : 0;
        var dots = dotsEl.querySelectorAll('.ts-dot');
        for (var i = 0; i < dots.length; i++) {
          if (i === page) dots[i].setAttribute('aria-current', 'true');
          else dots[i].removeAttribute('aria-current');
        }
      }

      prev.addEventListener('click', function () { track.scrollBy({ left: -step() * perView(), behavior: behavior() }); });
      next.addEventListener('click', function () { track.scrollBy({ left: step() * perView(), behavior: behavior() }); });

      var ticking = false;
      track.addEventListener('scroll', function () {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () { update(); ticking = false; });
      }, { passive: true });

      var rt;
      window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(buildDots, 150); });

      buildDots();
    })();
  </script>
