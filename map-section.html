<!-- =====================================================================
     FULL-WIDTH GOOGLE MAP SECTION – DR. FAIZA SHAIKH
     Drop this inside <main> (for example just above the footer).
     Self-contained: styles are scoped to .mp-section and fall back to the
     brand palette if style.css is absent.

     TO SET UP (2 steps):
     1. Paste your Google Maps embed link into <iframe src="..."> below
        (Google Maps > Share > Embed a map > copy the src URL).
     2. Fill in the CONFIG block in the script at the bottom (address and
        phone). It updates the card text and the Directions / Call links.
     ===================================================================== -->
<section class="mp-section" id="clinic-map" aria-labelledby="mp-title">

  <style>
    .mp-section {
      --mp-primary: var(--primary, #0f766e);
      --mp-secondary: var(--secondary, #14b8a6);
      --mp-accent: var(--accent, #06b6d4);
      --mp-text: var(--text, #1f2937);
      --mp-deep: color-mix(in srgb, var(--mp-primary) 45%, #04211f);
      --mp-muted: color-mix(in srgb, var(--mp-text) 68%, #fff);
      --mp-tint: color-mix(in srgb, var(--mp-secondary) 14%, #fff);
      --mp-display: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --mp-body: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      --mp-ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      --mp-pad: clamp(0.75rem, 3vw, 2rem);

      position: relative;
      width: 100%;
      padding: clamp(2.5rem, 2rem + 3vw, 5rem) var(--mp-pad);
      font-family: var(--mp-body);
      color: var(--mp-text);
      background: color-mix(in srgb, var(--mp-secondary) 6%, #fff);
    }
    .mp-section *, .mp-section *::before, .mp-section *::after { box-sizing: border-box; }

    .mp-frame { position: relative; width: 100%; max-width: 1680px; margin-inline: auto; }

    /* ---------- Map ---------- */
    .mp-map {
      position: relative;
      width: 100%;
      height: clamp(300px, 62vw, 420px);
      overflow: hidden;
      background: var(--mp-tint);
      border: 1px solid rgb(255 255 255 / 0.9);
      border-radius: 28px;
      box-shadow: 0 30px 60px -28px rgb(15 118 110 / 0.5);
    }
    /* Friendly placeholder behind the iframe until a real map loads */
    .mp-map-bg {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 0.6rem;
      padding: 1.5rem;
      text-align: center;
      color: var(--mp-primary);
      background:
        linear-gradient(rgb(255 255 255 / 0.5), rgb(255 255 255 / 0.5)),
        repeating-linear-gradient(0deg, transparent 0 39px, rgb(15 118 110 / 0.09) 39px 40px),
        repeating-linear-gradient(90deg, transparent 0 39px, rgb(15 118 110 / 0.09) 39px 40px),
        linear-gradient(145deg, var(--mp-tint), #e0f7fa);
    }
    .mp-map-bg svg { width: 44px; height: 44px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .mp-map-bg span { font-size: 0.9rem; font-weight: 500; color: var(--mp-muted); }
    .mp-map iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      filter: saturate(0.92) contrast(1.02);
      transition: filter 0.4s var(--mp-ease);
    }
    .mp-map:hover iframe { filter: none; }

    /* ---------- Info card (overlay on desktop, overlapping panel on mobile) ---------- */
    .mp-card {
      position: relative;
      z-index: 2;
      margin: -2.25rem 0.85rem 0;
      padding: clamp(1.3rem, 1rem + 1.5vw, 1.9rem);
      background: rgb(255 255 255 / 0.82);
      border: 1px solid rgb(255 255 255 / 0.95);
      border-radius: 24px;
      box-shadow: 0 30px 60px -24px rgb(15 118 110 / 0.5), inset 0 0 0 1px rgb(15 118 110 / 0.06);
      -webkit-backdrop-filter: blur(20px) saturate(170%);
      backdrop-filter: blur(20px) saturate(170%);
    }
    @media (min-width: 900px) {
      .mp-map { height: clamp(500px, 68vh, 680px); }
      .mp-card {
        position: absolute;
        top: 50%;
        left: clamp(1.25rem, 3vw, 3rem);
        width: min(410px, 42%);
        margin: 0;
        transform: translateY(-50%);
      }
    }

    .mp-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--mp-primary);
    }
    .mp-tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mp-secondary); box-shadow: 0 0 0 4px rgb(20 184 166 / 0.2); }

    .mp-title {
      margin: 0 0 0.25rem;
      font-family: var(--mp-display);
      font-size: clamp(1.4rem, 1.15rem + 1.1vw, 1.85rem);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.015em;
      color: var(--mp-deep);
    }
    .mp-sub { margin: 0 0 1.2rem; font-size: 0.92rem; color: var(--mp-muted); }

    .mp-rows { display: grid; gap: 0.95rem; margin: 0 0 1.3rem; padding: 0; list-style: none; }
    .mp-rows li { display: flex; gap: 0.85rem; align-items: flex-start; }
    .mp-ico {
      flex: none;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      color: var(--mp-primary);
      background: linear-gradient(145deg, #fff, var(--mp-tint));
      border: 1px solid color-mix(in srgb, var(--mp-secondary) 35%, #fff);
      border-radius: 12px;
    }
    .mp-ico svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .mp-rows small { display: block; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.02em; color: var(--mp-primary); }
    .mp-rows address, .mp-rows p { margin: 0; font-style: normal; font-size: 0.97rem; line-height: 1.5; font-weight: 500; overflow-wrap: anywhere; }
    .mp-rows a { color: var(--mp-text); text-decoration: none; }
    .mp-rows a:hover { color: var(--mp-primary); text-decoration: underline; text-underline-offset: 3px; }

    .mp-status {
      display: none;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.4rem;
      padding: 0.2rem 0.7rem 0.2rem 0.55rem;
      font-size: 0.78rem;
      font-weight: 600;
      border-radius: 999px;
    }
    .mp-status.show { display: inline-flex; }
    .mp-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .mp-status.open { color: #166534; background: #dcfce7; }
    .mp-status.closed { color: #92400e; background: #fef3c7; }

    .mp-actions { display: grid; grid-template-columns: 1fr; gap: 0.7rem; }
    @media (min-width: 400px) { .mp-actions { grid-template-columns: 1.4fr 1fr; } }
    .mp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      min-height: 52px;
      padding: 0.75rem 1.1rem;
      font: 650 0.97rem/1.2 var(--mp-body);
      text-decoration: none;
      border: 1.5px solid transparent;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.3s var(--mp-ease), box-shadow 0.3s var(--mp-ease), background-color 0.3s var(--mp-ease), color 0.3s var(--mp-ease);
    }
    .mp-btn:hover { transform: translateY(-3px); text-decoration: none; }
    .mp-btn:active { transform: translateY(0); }
    .mp-btn svg { flex: none; width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
    .mp-btn-dir {
      color: #fff;
      background: linear-gradient(135deg, var(--mp-primary), color-mix(in srgb, var(--mp-primary) 65%, var(--mp-secondary)));
      box-shadow: 0 12px 24px -10px rgb(15 118 110 / 0.6);
    }
    .mp-btn-dir:hover { color: #fff; box-shadow: 0 18px 30px -12px rgb(15 118 110 / 0.7); }
    .mp-btn-call { color: var(--mp-primary); background: rgb(255 255 255 / 0.9); border-color: color-mix(in srgb, var(--mp-primary) 40%, #fff); }
    .mp-btn-call:hover { color: var(--mp-deep); background: var(--mp-tint); border-color: var(--mp-primary); }

    .mp-section :focus-visible { outline: 3px solid var(--mp-accent); outline-offset: 3px; border-radius: 8px; }

    @media (prefers-reduced-motion: reduce) { .mp-section * { transition: none !important; } }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .mp-card { background: rgb(255 255 255 / 0.97); }
    }
  </style>

  <div class="mp-frame">

    <div class="mp-map">
      <div class="mp-map-bg" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.200-7-11.500a7 7 0 0 1 14 0C19 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg>
        <span>Your clinic map will appear here</span>
      </div>
      <!-- PASTE YOUR GOOGLE MAPS EMBED LINK as the src value below -->
      <iframe
        src="PASTE_GOOGLE_MAP_EMBED_LINK"
        title="Map showing the location of Dr. Faiza Shaikh's clinic"
        loading="lazy"
        allowfullscreen
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>

    <article class="mp-card">
      <span class="mp-tag">Find Our Clinic</span>
      <h2 class="mp-title" id="mp-title">Dr. Faiza Shaikh</h2>
      <p class="mp-sub">Homeopathy Clinic</p>

      <ul class="mp-rows">
        <li>
          <div class="mp-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.200-7-11.500a7 7 0 0 1 14 0C19 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg>
          </div>
          <div><small>Address</small><address id="mpAddress">[YOUR CLINIC ADDRESS]</address></div>
        </li>
        <li>
          <div class="mp-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          </div>
          <div>
            <small>Timings</small>
            <p>Mon – Sat, 10:00 AM – 8:00 PM</p>
            <span class="mp-status" id="mpStatus" role="status"></span>
          </div>
        </li>
        <li>
          <div class="mp-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
          </div>
          <div><small>Phone</small><p><a id="mpPhone" href="tel:+910000000000">[YOUR PHONE]</a></p></div>
        </li>
      </ul>

      <div class="mp-actions">
        <a id="mpDir" href="https://www.google.com/maps" class="mp-btn mp-btn-dir" target="_blank" rel="noopener" aria-label="Get directions on Google Maps (opens in a new tab)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 18-8-8 18-2-8z"/></svg>
          Get Directions
        </a>
        <a id="mpCall" href="tel:+910000000000" class="mp-btn mp-btn-call">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.500 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
          Call
        </a>
      </div>
    </article>

  </div>

  <script>
    (function () {
      /* ------------------------ CONFIG: fill these in ------------------------ */
      var CONFIG = {
        address: '',   // e.g. '123 Clinic Street, Koregaon Park, Pune, Maharashtra 411001'
        phone:   ''    // e.g. '+91 98765 43210'
      };
      /* Clinic hours (India time). 0 = Sunday ... 6 = Saturday */
      var HOURS = { openDays: [1, 2, 3, 4, 5, 6], openMin: 10 * 60, closeMin: 20 * 60, tz: 'Asia/Kolkata' };
      /* ----------------------------------------------------------------------- */

      var section = document.currentScript.parentElement;
      function $(id) { return section.querySelector('#' + id); }

      if (CONFIG.address) {
        $('mpAddress').textContent = CONFIG.address;
        $('mpDir').href = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(CONFIG.address);
      }
      if (CONFIG.phone) {
        var tel = 'tel:' + CONFIG.phone.replace(/[^\d+]/g, '');
        $('mpPhone').textContent = CONFIG.phone;
        $('mpPhone').href = tel;
        $('mpCall').href = tel;
      }

      /* Open / closed badge based on clinic time, not the visitor's time zone */
      try {
        var parts = new Intl.DateTimeFormat('en-US', { timeZone: HOURS.tz, weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(new Date());
        var get = function (t) { return parts.filter(function (p) { return p.type === t; })[0].value; };
        var day = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(get('weekday'));
        var mins = parseInt(get('hour'), 10) * 60 + parseInt(get('minute'), 10);
        var isOpenDay = HOURS.openDays.indexOf(day) !== -1;
        var badge = $('mpStatus');

        if (isOpenDay && mins >= HOURS.openMin && mins < HOURS.closeMin) {
          badge.textContent = 'Open now · closes at 8:00 PM';
          badge.className = 'mp-status show open';
        } else {
          badge.textContent = (isOpenDay && mins < HOURS.openMin) ? 'Closed now · opens today at 10:00 AM' : 'Closed now · see timings above';
          badge.className = 'mp-status show closed';
        }
      } catch (e) { /* badge simply stays hidden */ }
    })();
  </script>
</section>
